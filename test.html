<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>앤디샌디 수업 테스트</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;margin:0;background:#f4f6f8;color:#222;-webkit-user-select:none;user-select:none}
.top{background:#0b7a75;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:19px}.top .sub{font-size:13px;opacity:.9;margin-top:2px}
.timer{font-size:26px;font-weight:bold;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.15);border-radius:10px;padding:4px 12px}
.timer.low{background:#e74c3c}
.wrap{padding:14px;max-width:900px;margin:0 auto}
.box{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.big{font-size:20px;font-weight:bold;margin:0 0 10px}
.muted{color:#777;font-size:15px;line-height:1.7}
.btn{display:inline-block;border:0;border-radius:12px;background:#0b7a75;color:#fff;font-size:19px;font-weight:bold;padding:14px 22px;cursor:pointer}
.btn.line{background:#fff;color:#0b7a75;border:2px solid #0b7a75}.btn.red{background:#c0392b}.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.nm{border:2px solid #cfe7e5;background:#fff;border-radius:12px;padding:16px 8px;font-size:20px;font-weight:bold;text-align:center;cursor:pointer}
.nm.done{opacity:.35}
.q{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);border:2px solid transparent}
.q.ans{border-color:#cfe7e5}
.qn{font-weight:bold;font-size:18px;color:#0b7a75;margin-right:6px}
.st{font-size:18px;line-height:1.7;white-space:pre-wrap}
.ops{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.op{display:flex;align-items:center;gap:10px;border:2px solid #ddd;border-radius:10px;padding:10px 12px;font-size:18px;cursor:pointer;background:#fafafa}
.op .c{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid #aaa;display:flex;align-items:center;justify-content:center;font-weight:bold}
.op.on{border-color:#0b7a75;background:#e8f5f4}.op.on .c{background:#0b7a75;color:#fff;border-color:#0b7a75}
.row5{display:flex;gap:10px;margin-top:10px}.row5 .op{flex:1;justify-content:center}
input.tx{width:100%;font-size:20px;padding:12px;border:2px solid #ccc;border-radius:10px;margin-top:10px;-webkit-user-select:text;user-select:text}
input.tx:focus{border-color:#0b7a75;outline:0}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.score{font-size:46px;font-weight:bold;color:#0b7a75;margin:6px 0}
.pass{color:#1a7f37;font-weight:bold;font-size:20px}.fail{color:#d9822b;font-weight:bold;font-size:20px}
.wr{display:inline-block;background:#fdecea;color:#c0392b;border-radius:8px;padding:4px 10px;margin:3px;font-weight:bold;font-size:18px}
.key{font-size:18px;line-height:1.9}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal .box{max-width:460px;width:100%;text-align:center}
table{width:100%;border-collapse:collapse;font-size:17px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
.lv{display:inline-block;background:#fff3cd;color:#8a6d00;border-radius:8px;padding:2px 8px;font-size:14px;margin-left:6px;font-weight:bold}
</style></head><body>
<div class="top"><div><h1 id="ttl">앤디샌디 수업 테스트</h1><div class="sub" id="sub"></div></div><div class="timer" id="tm" style="display:none"></div></div>
<div class="wrap" id="app"><div class="box muted">불러오는 중이에요… ⏳</div></div>
<div id="md"></div>
<script>
var EXEC='https://script.google.com/macros/s/AKfycbz8yybz4La7mAmek3L0mMIwpI_j92Qpe0r9V9XVpyb2FomZcuEeFhadB4IzOngQQVb1mA/exec';
var P=new URLSearchParams(location.search), TEACH=P.get('t')==='1';
var S={q:null,name:'',ans:[],off:0,tick:null,poll:null,sent:false};
var app=document.getElementById('app');
function api(fn,args){return fetch(EXEC,{method:'POST',credentials:'omit',body:JSON.stringify({fn:fn,args:args||[]})}).then(function(r){return r.json();}).then(function(j){if(!j||j.err)throw new Error(j&&j.err||'x');return j.res;});}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fm(s){return esc(s).replace(/\[u\]/g,'<u>').replace(/\[\/u\]/g,'</u>');}
function C(n){return '①②③④⑤⑥⑦⑧⑨⑩'.charAt(n-1)||n;}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function err(m){app.innerHTML='<div class="box"><p class="big">앗, 연결이 안 됐어요</p><p class="muted">'+esc(m||'인터넷 연결을 확인하고 다시 눌러 주세요.')+'</p><button class="btn" onclick="location.reload()">다시 불러오기</button></div>';}
function title(q){document.getElementById('ttl').innerHTML=esc(q.name)+(q.lv?'<span class="lv">'+esc(q.lv)+' 수준</span>':'');}
function modal(h){document.getElementById('md').innerHTML=h?'<div class="modal"><div class="box">'+h+'</div></div>':'';}
history.pushState(null,'',location.href);window.addEventListener('popstate',function(){history.pushState(null,'',location.href);});

/* ───── 학생 ───── */
function home(){
  api('quizToday').then(function(L){
    if(!L||!L.length){app.innerHTML='<div class="box"><p class="big">오늘 볼 테스트가 없어요</p><p class="muted">선생님께 말해 주세요.</p><button class="btn line" onclick="location.reload()">새로고침</button></div>';return;}
    if(L.length===1)return pick(L[0].id);
    app.innerHTML='<div class="box"><p class="big">어떤 테스트인가요?</p><div class="grid">'+L.map(function(q){return '<div class="nm" onclick="pick('+q.id+')">'+esc(q.name)+'<div class="muted">'+esc(q.cls)+'</div></div>';}).join('')+'</div></div>';
  }).catch(function(){err();});
}
function pick(id){
  api('quizStudents',[id]).then(function(r){
    if(!r){err('테스트를 찾지 못했어요.');return;}
    S.q=r.quiz;title(S.q);document.getElementById('sub').textContent=S.q.n+'문제 · '+S.q.min+'분';
    app.innerHTML='<div class="box"><p class="big">내 이름을 눌러 주세요</p><div class="grid">'+r.students.map(function(s){return '<div class="nm'+(s.done?' done':'')+'" data-n="'+esc(s.name)+'">'+esc(s.name)+(s.done?'<div class="muted">제출함</div>':'')+'</div>';}).join('')+'</div></div>';
    [].forEach.call(app.querySelectorAll('.nm'),function(el){el.onclick=function(){var n=el.getAttribute('data-n');
      modal('<p class="big">'+esc(n)+' 맞아요?</p><p><button class="btn" id="y">네, 맞아요</button> <button class="btn line" onclick="modal()">아니에요</button></p>');
      document.getElementById('y').onclick=function(){modal();S.name=n;el.classList.contains('done')?result():wait();};};});
  }).catch(function(){err();});
}
function wait(){
  var q=S.q;
  if(q.start){S.off=q.now-Date.now();return test();}
  app.innerHTML='<div class="box"><p class="big">'+esc(S.name)+', 준비됐어요 👍</p><p class="muted">선생님이 시작을 누르면 문제가 열려요.<br>잠깐만 기다려 주세요.</p></div>';
  clearInterval(S.poll);S.poll=setInterval(function(){api('quizState',[q.id]).then(function(s){if(s&&s.start){clearInterval(S.poll);S.q=s;S.off=s.now-Date.now();test();}}).catch(function(){});},3000);
}
function key(){return 'qz_'+S.q.id+'_'+S.q.sd+'_'+S.name;}
function test(){
  var q=S.q,n=q.n,mc={};(q.mc||[]).forEach(function(i){mc[i]=1;});
  S.ans=store(key())||[];while(S.ans.length<n)S.ans.push('');
  var h='';
  for(var i=1;i<=n;i++){
    var d=(q.qs||[])[i-1]||{},v=S.ans[i-1];
    h+='<div class="q'+(v!==''?' ans':'')+'" id="q'+i+'"><div class="st"><span class="qn">'+i+'.</span>'+fm(d.s||'')+'</div>';
    if(d.o){h+='<div class="ops">'+d.o.map(function(o,j){var val=d.tv?o:String(j+1);return '<div class="op'+(v===val?' on':'')+'" data-i="'+i+'" data-v="'+esc(val)+'"><span class="c">'+(d.tv?String.fromCharCode(65+j):C(j+1))+'</span><span>'+fm(o)+'</span></div>';}).join('')+'</div>';}
    else if(mc[i]&&!d.s){h+='<div class="row5">'+[1,2,3,4,5].map(function(j){return '<div class="op'+(v===String(j)?' on':'')+'" data-i="'+i+'" data-v="'+j+'"><span class="c">'+C(j)+'</span></div>';}).join('')+'</div>';}
    else{h+='<input class="tx" data-i="'+i+'" value="'+esc(v)+'" placeholder="'+esc(d.p||'답을 쓰세요')+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">';}
    h+='</div>';
  }
  app.innerHTML=h+'<div class="bar"><span class="muted" id="cnt"></span><button class="btn" id="sb">제출하기</button></div>';
  [].forEach.call(app.querySelectorAll('.op'),function(el){el.onclick=function(){var i=+el.getAttribute('data-i');set(i,el.getAttribute('data-v'));[].forEach.call(document.querySelectorAll('.op[data-i="'+i+'"]'),function(x){x.classList.toggle('on',x===el);});};});
  [].forEach.call(app.querySelectorAll('input.tx'),function(el){el.oninput=function(){set(+el.getAttribute('data-i'),el.value);};});
  document.getElementById('sb').onclick=function(){var left=S.ans.filter(function(a){return String(a).trim()==='';}).length;
    modal('<p class="big">제출할까요?</p>'+(left?'<p class="fail">아직 '+left+'문제를 안 풀었어요.</p>':'<p class="muted">제출하면 고칠 수 없어요.</p>')+'<p><button class="btn" id="y">제출</button> <button class="btn line" onclick="modal()">더 풀기</button></p>');
    document.getElementById('y').onclick=function(){modal();submit();};};
  cnt();clock();
}
function set(i,v){S.ans[i-1]=v;store(key(),S.ans);var b=document.getElementById('q'+i);if(b)b.classList.toggle('ans',String(v).trim()!=='');cnt();}
function cnt(){var c=S.ans.filter(function(a){return String(a).trim()!=='';}).length,e=document.getElementById('cnt');if(e)e.textContent='푼 문제 '+c+' / '+S.q.n;}
function clock(){
  var tm=document.getElementById('tm');tm.style.display='';
  var end=S.q.start+S.q.min*60000;
  clearInterval(S.tick);S.tick=setInterval(function(){
    var left=Math.max(0,Math.round((end-(Date.now()+S.off))/1000));
    tm.textContent=Math.floor(left/60)+':'+('0'+left%60).slice(-2);tm.classList.toggle('low',left<=60);
    if(left<=0){clearInterval(S.tick);modal('<p class="big">⏰ 시간이 끝났어요</p><p class="muted">지금까지 푼 답을 제출하고 있어요…</p>');submit();}
  },500);
}
function submit(){
  if(S.sent)return;S.sent=true;var sb=document.getElementById('sb');if(sb)sb.disabled=true;
  app.insertAdjacentHTML('afterbegin','<div class="box muted" id="sending">제출하는 중이에요… ⏳</div>');window.scrollTo(0,0);
  var go=function(k){api('quizSubmit',[S.q.id,S.name,S.ans]).then(function(r){clearInterval(S.tick);document.getElementById('tm').style.display='none';modal();show(r);}).catch(function(){if(k<5)setTimeout(function(){go(k+1);},2000);else{S.sent=false;modal('<p class="big">제출이 안 됐어요</p><p class="muted">답은 저장돼 있어요. 인터넷을 확인하고 다시 눌러 주세요.</p><p><button class="btn" onclick="modal();submit()">다시 제출</button></p>');}});};
  go(0);
}
function result(){api('quizCheck',[S.q.id,S.name]).then(show).catch(function(){err();});}
function show(r){
  if(!r||!r.ok){app.innerHTML='<div class="box"><p class="big">'+esc(r&&r.msg||'결과를 못 불러왔어요')+'</p></div>';return;}
  var h='<div class="box" style="text-align:center"><p class="muted">'+esc(S.name)+'의 점수</p><div class="score">'+r.score+'점</div><p class="muted">'+r.n+'문제 중 '+r.right+'개 맞음</p>'+
    (r.pass?'<p class="pass">🎉 통과! 90점 넘었어요</p>':'<p class="fail">90점까지 조금 남았어요 💪</p>'+(r.home?'<p class="muted">다음 수업까지 집에서 <b>'+esc(r.home)+'</b>를 매일 봐요.<br>90점이 넘으면 남은 날은 안 해도 돼요.</p>':''))+'</div>';
  h+='<div class="box"><p class="big">틀린 문제</p>'+(r.wrong.length?r.wrong.map(function(i){return '<span class="wr">'+i+'번</span>';}).join(''):'<p class="pass">하나도 안 틀렸어요! 👏</p>')+'</div>';
  if(r.wrong.length){h+=r.open&&r.keys?'<div class="box"><p class="big">정답</p>'+r.keys.map(function(k){return '<div class="key"><b>'+k.no+'번</b> → '+esc(/^\d$/.test(k.ans)?C(+k.ans):k.ans)+'</div>';}).join('')+'</div>':'<div class="box muted">선생님이 정답을 공개하면 여기에 정답이 나와요.<br>그동안 틀린 문제를 다시 풀어 보세요.</div>';}
  h+='<div class="box muted" style="text-align:center">끝났으면 태블릿을 내려놓고 기다려 주세요.</div>';
  app.innerHTML=h;window.scrollTo(0,0);
  clearInterval(S.poll);if(r.wrong.length&&!r.open)S.poll=setInterval(function(){api('quizCheck',[S.q.id,S.name]).then(function(x){if(x&&x.open){clearInterval(S.poll);show(x);}}).catch(function(){});},10000);
}

/* ───── 선생님 ───── */
var T={pin:'',id:0,t:null};
function tHome(){
  T.pin=(function(){try{return sessionStorage.getItem('qpin')||'';}catch(e){return '';}})();
  api('quizToday').then(function(L){
    if(!L||!L.length){app.innerHTML='<div class="box"><p class="big">오늘 테스트가 없어요</p><p class="muted">[수업테스트] 탭에 오늘 날짜로 넣어 주세요.</p></div>';return;}
    app.innerHTML='<div class="box"><p class="big">선생님 화면</p><input class="tx" id="pin" type="password" inputmode="numeric" placeholder="선생님 번호 4자리" value="'+esc(T.pin)+'"><div class="grid" style="margin-top:12px">'+L.map(function(q){return '<div class="nm" data-id="'+q.id+'">'+esc(q.name)+'<div class="muted">'+esc(q.cls)+'</div></div>';}).join('')+'</div></div>';
    [].forEach.call(app.querySelectorAll('.nm'),function(el){el.onclick=function(){T.pin=document.getElementById('pin').value.trim();try{sessionStorage.setItem('qpin',T.pin);}catch(e){}T.id=+el.getAttribute('data-id');tLoad();};});
  }).catch(function(){err();});
}
function tLoad(fn,arg){
  api(fn||'quizTeacher',fn?[T.id,T.pin,arg]:[T.id,T.pin]).then(function(r){
    if(!r||!r.ok){app.insertAdjacentHTML('afterbegin','<div class="box fail">'+esc(r&&r.msg||'안 됐어요')+'</div>');return;}
    var q=r.quiz;title(q);document.getElementById('sub').textContent=q.cls+' · '+q.n+'문제 · '+q.min+'분';
    var done=r.list.filter(function(x){return x.score!=null;}),passN=done.filter(function(x){return x.score>=90;}).length;
    var h='<div class="box">';
    if(!q.start)h+='<button class="btn" id="go">▶ 시작 ('+q.min+'분)</button> <span class="muted">누르면 모든 태블릿에 문제가 열려요</span>';
    else{var left=Math.max(0,Math.round((q.start+q.min*60000-q.now)/1000));h+='<p class="big">'+(left?'진행 중 · 남은 시간 '+Math.floor(left/60)+':'+('0'+left%60).slice(-2):'시간 끝')+'</p><button class="btn line" id="stop">시작 취소</button> ';}
    h+=' <button class="btn '+(q.open?'line':'red')+'" id="rv">'+(q.open?'정답 숨기기':'🔓 정답 공개')+'</button></div>';
    h+='<div class="box"><p class="big">제출 '+done.length+' / '+r.list.length+'명 · 통과 '+passN+'명</p><table><tr><th>이름</th><th>점수</th><th>틀린 번호</th></tr>'+r.list.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td>'+(x.score==null?'<span class="muted">-</span>':'<b class="'+(x.score>=90?'pass':'fail')+'" style="font-size:17px">'+x.score+'</b>')+'</td><td>'+esc(x.wrong.join(', '))+'</td></tr>';}).join('')+'</table></div>';
    if(r.often.length)h+='<div class="box"><p class="big">많이 틀린 문제 (설명할 것)</p>'+r.often.map(function(o){return '<div class="key"><b>'+o.no+'번</b> '+o.n+'명 · 정답 '+esc(/^\d$/.test(o.ans)?C(+o.ans):o.ans)+'</div>';}).join('')+'</div>';
    app.innerHTML=h;
    var g=document.getElementById('go');if(g)g.onclick=function(){tLoad('quizStart',true);};
    var s=document.getElementById('stop');if(s)s.onclick=function(){modal('<p class="big">시작을 취소할까요?</p><p class="muted">학생들 화면이 대기 상태로 돌아가지 않을 수 있어요.</p><p><button class="btn red" id="y">취소하기</button> <button class="btn line" onclick="modal()">아니요</button></p>');document.getElementById('y').onclick=function(){modal();tLoad('quizStart',false);};};
    document.getElementById('rv').onclick=function(){tLoad('quizReveal',!q.open);};
    clearTimeout(T.t);T.t=setTimeout(function(){tLoad();},10000);
  }).catch(function(){clearTimeout(T.t);T.t=setTimeout(function(){tLoad();},10000);});
}
TEACH?tHome():home();
</script>
</body></html>
